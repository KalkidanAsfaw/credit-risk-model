name: CI

on:
  push:
    branches: [main, task-*]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt flake8

      - name: Lint with flake8
        run: flake8 src/ tests/ --max-line-length=120 --ignore=E501,W503

      - name: Run tests
        run: PYTHONPATH=. pytest tests/ -v --tb=short
